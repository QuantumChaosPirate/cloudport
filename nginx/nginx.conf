# Main Nginx configuration file

user nginx;
# Auto-detect number of CPU cores for worker processes
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {
    # Standard MIME types for serving different file formats
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format including response time for monitoring
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Efficient file serving
    sendfile on;

    # Keep connections alive for 65 seconds
    keepalive_timeout 65;

    # Enable gzip compression to reduce bandwidth
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Maximum upload size — 10GB to support large media files
    client_max_body_size 10G;

    # Include virtual host configurations
    include /etc/nginx/conf.d/*.conf;
}
